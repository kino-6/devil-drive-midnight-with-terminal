  moe.run.contact_to_command.2: "撃つ、読む、話す。順番で勝てる。"
  # 利用場面: アンブッシュ発生
  moe.run.ambush_contact: "見落とした。ごめん、来る。"
  moe.run.ambush_contact.1: "伏せて。謝るのはあと。"
  moe.run.ambush_contact.2: "悔しい。でも今は受ける。"
  moe.run.ambush_contact.3: "近すぎる。次で取り返すよ。"

  # 利用場面: approach選択時の不足リソース
