  moe.prologue.open: "0時。夜環、起きたよ。"
  moe.prologue.open.1: "夜環、開いた。帰り道はわたしが持つ。"
  moe.prologue.open.2: "Midnight Bay接続。ね、今夜も走れる。"
  moe.prologue.open.3: "エンジン良好。手、離さないでね。"
  # 利用場面: プロローグオーバーレイ（長め導入）
  moe.prologue.narrative: "0時。夜環が開いた。任務はサルベージ、でも奥で前任者の声がまだ鳴ってる。"

  # 利用場面: ストーリー進行後のGarage台詞（LOG_00回収後）
  moe.story.after_log00: "前任者の声、知らないはずなのに懐かしい。"
  # 利用場面: ボスプレビュー時、LOG_01回収後の補足
  moe.story.boss_preview_log01: "関門の癖、少し読めた。払う相手を間違えないで。"

  # 利用場面: NAVIスキャン成功（通常）
  moe.run.scan_success: "先に見つけた。えへん。"
