  moe.run.scan_success.2: "入口、選べるよ。焦らないで。"
  moe.run.scan_success.3: "先読み勝ち。こっちの拍子で入ろ。"
  # 利用場面: NAVIスキャン失敗（通常）
  moe.run.scan_fail: "遅れた。来るよ。"
  moe.run.scan_fail.1: "反応、割れた。初撃に備えて。"
  moe.run.scan_fail.2: "読み負けた。でも立て直せる。"
  moe.run.scan_fail.3: "ノイズ濃い。むう、道路が意地悪。"
  # 利用場面: Run開始直後の短いNAVI確認
  moe.run.start: "Run開始。無理は、わたしが止める。"
  moe.run.start.1: "夜環へ入る。残りはわたしが見る。"
  moe.run.start.2: "欲張っていいよ。帰れるぶんだけね。"
