# Dialogue text pack (v1)
# 編集方針:
# - 作中セリフ/誘導文をコードから切り離し、ここで管理する
# - 各キーの直前コメントに「利用場面」を書く
# - 数値バランスはこのファイルに置かない（balance.yaml側）

version: "dialogue-v1"

lines:
