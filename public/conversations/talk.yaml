  talk.result.good.2: "{target}の波形が安定する。"
  talk.result.bad.1: "{target}の反応が荒れる。"
  talk.result.bad.2: "{target}は不快を隠さない。"
  talk.result.good.hungry.desperate.1: "{target}は代価に飛びついた。"
  talk.result.bad.hostile.aggressive.1: "{target}が敵意を隠さず圧を上げる。"

  talk.result.contract_window.1: "契約窓が薄く開く。"
  talk.result.intent_worse.1: "反応悪化。次の挙動が攻撃的になる。"
  talk.result.paid.1: "代価は受理された。"
  talk.result.bargain_success.1: "条件の一部だけ通った。"
  talk.result.bargain_fail.1: "交渉は不成立。請求だけ残る。"
  talk.result.refused.1: "拒否は記録された。圧は上がる。"
  talk.result.threaten_success.1: "威圧は通った。だが関係は荒れる。"
  talk.result.threaten_fail.1: "威圧は逆効果。反発が強まる。"

