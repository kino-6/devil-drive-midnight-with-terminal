  analyze.boon.damage_reduction.curse: "ANALYZE LOCK: CURSE -1"

  talk.prompt.default.1: "{target}が車線上で信号ノイズを撫でている。"
  talk.prompt.default.2: "{target}は反応を返さず、こちらの呼吸だけを測っている。"
  talk.prompt.default.3: "{target}の視線が端末に刺さる。先に言葉を置け。"

  talk.prompt.hungry.1: "{target}は代価の匂いを探っている。"
  talk.prompt.hungry.greedy.annoyed.1: "{target}が空腹を隠さず、今すぐ支払えと迫る。"
  talk.prompt.machine.1: "{target}は整合性のある応答を要求している。"
  talk.prompt.machine.cautious.calm.1: "{target}は遅延付きで同じ問いを繰り返す。"
  talk.prompt.lonely.1: "{target}は沈黙の間だけを待っている。"
  talk.prompt.proud.1: "{target}は礼式か胆力か、どちらかを試している。"
  talk.prompt.proud.volatile.aggressive.1: "{target}は一言目から威圧的だ。"
  talk.prompt.curious.1: "{target}は定型外の返答を面白がる。"
  talk.prompt.hostile.1: "{target}の反応は硬い。半端な言葉は逆効果。"

  talk.demand.prompt.default.1: "{target}が通行料を要求。{resource}を{amount}。"
  talk.demand.prompt.default.2: "{target}は支払い確認を要求。{resource} {amount}。"
  talk.demand.prompt.hungry.1: "{target}は飢えている。{resource}を{amount}渡せと迫る。"
  talk.demand.prompt.machine.1: "{target}は同期料を要求。{resource} {amount}。"
  talk.demand.prompt.proud.1: "{target}は礼式通行を要求。{resource}を{amount}。"
  talk.demand.prompt.hostile.1: "{target}が恫喝。{resource}を{amount}差し出せ。"

