  talk.player_line.default: "{attitude}で返す。"
  talk.player_line.offer.1: "代価を出す。これでどうだ。"
  talk.player_line.listen.1: "急がない。まずお前の要求を聞く。"
  talk.player_line.logic.1: "条件を整理して互いに得する形を探る。"
  talk.player_line.flatter.1: "礼を尽くす。通す価値はあるはずだ。"
  talk.player_line.challenge.1: "条件は飲むが、こちらにも線を引く。"
  talk.player_line.threaten.1: "退かなければ強行する。"
  talk.player_line.joke.1: "肩の力を抜け。まだ交渉は終わってない。"
  talk.player_line.pay.1: "払う。通行権を寄越せ。"
  talk.player_line.bargain.1: "全額は無理だ。条件を刻もう。"
  talk.player_line.refuse.1: "その要求は飲めない。"

