  talk.success.lonely: "交渉成立。孤独反応が減衰、次行動が弱まる。"
  talk.success.machine: "交渉成立。機械霊プロセスが低脅威モードへ遷移。"
  talk.success.proud: "交渉成立。威圧は残るが、次の一手は緩む。"
  talk.success.curious: "交渉成立。興味が勝って攻勢が鈍る。"
  talk.success.hostile: "交渉成立。敵意は残るが、初動を崩せた。"
