events:
  salvage:
    sealed_cannon_crate:
      title: "Sealed Cannon Crate"
      pool: "salvage.stage_1"
      weight: 1
      tags: "ammo, safe, one_pull"
      body: "An old service crate is still sealed. The lane camera is waking up, so only one bundle can be lifted before the shutter drops."
      effects: "Main ammo favored / one safe extraction."
      rewardId: "cannon_shell"
      log: "SALVAGE EVENT: SEALED CANNON CRATE"
      moeLine: "封印コンテナ。開けたら閉じる、だから一回だけ。"
    roadside_patch_bay:
      title: "Roadside Patch Bay"
      pool: "salvage.stage_1"
      weight: 1
      tags: "armor, repair, one_pull"
      body: "A broken maintenance arm can weld one plate before its daemon timer burns out. Choose the repair that matters most."
      effects: "Armor favored / one repair cycle."
      rewardId: "armor_patch"
      log: "SALVAGE EVENT: ROADSIDE PATCH BAY"
      moeLine: "整備アーム、まだ一回だけ動く。装甲を戻すなら今。"
    flicker_sign_post:
      title: "Flicker Sign Post"
      pool: "salvage.stage_1"
      weight: 1
      tags: "signal, analyze, one_pull"
      body: "A cracked route sign repeats a clean edge under heavy noise. Pulling the trace will collapse the other readings."
      effects: "Signal favored / other readings lost."
      rewardId: "signal_core"
      log: "SALVAGE EVENT: FLICKER SIGN POST"
      moeLine: "標識にきれいなSignal。抜くと他の反応は消えるよ。"
    tilted_fuel_tank:
      title: "Tilted Fuel Tank"
      pool: "salvage.stage_1"
      weight: 1
      tags: "fuel, risk, one_pull"
      body: "A roadside tank leans over the lane, leaking just enough pressure for one siphon before the valve snaps shut."
      effects: "Fuel favored / short siphon window."
      rewardId: "fuel_cell"
      log: "SALVAGE EVENT: TILTED FUEL TANK"
      moeLine: "燃料、取れる。でも弁がもたない。一回で決めよう。"
    capacitor_shrine:
      title: "Capacitor Shrine"
      pool: "salvage.stage_1"
      weight: 1
      tags: "se, ammo, one_pull"
      body: "Small capacitors are lined up like offerings. Touching one wakes the rest and drains the shrine dark."
      effects: "S-E ammo favored / one capacitor pull."
      rewardId: "se_cell"
      log: "SALVAGE EVENT: CAPACITOR SHRINE"
      moeLine: "S-E用の蓄電体。ひとつ取ると、残りは寝ちゃう。"
    field_cache_marker:
      title: "Field Cache Marker"
      pool: "salvage.stage_1"
      weight: 1
      tags: "mixed, safe, one_pull"
      body: "A faded driver mark points to a balanced cache. The marker is drifting, so there is time for one clean grab."
      effects: "Mixed fuel and armor favored."
      rewardId: "mixed_pack"
      log: "SALVAGE EVENT: FIELD CACHE MARKER"
      moeLine: "前のドライバー印。燃料と装甲、少しずつ拾える。"
    blueprint_ping:
      title: "Blueprint Ping"
      pool: "salvage.stage_1"
      weight: 1
      tags: "rare, blueprint, signal"
      body: "A faint part signature hides under the salvage noise. The ping is unstable, but it marks a deeper blueprint trail."
      effects: "Rare salvage hint / Signal favored."
      rewardId: "signal_core"
      log: "SALVAGE EVENT: BLUEPRINT PING"
      moeLine: "設計図っぽい反応。今夜は薄いけど、覚えておく。"
    stalled_patrol_trunk:
      title: "Stalled Patrol Trunk"
      pool: "salvage.stage_1"
      weight: 1
      tags: "mixed, patrol, one_pull"
      body: "A dead patrol car has one trunk still half-open. The lock daemon is counting down, so M.O.E. can hold it for one clean grab."
      effects: "Balanced recovery / one trunk cycle."
      rewardId: "mixed_pack"
      log: "SALVAGE EVENT: STALLED PATROL TRUNK"
      moeLine: "パトカーのトランク、まだ開く。長居はだめ、一回だけ。"
    callbox_signal_nest:
      title: "Callbox Signal Nest"
      pool: "salvage.stage_1"
      weight: 1
      tags: "signal, talk, one_pull"
      body: "Emergency callboxes blink in a chain, each repeating a cleaner carrier. Pull one signal core and the rest go dark."
      effects: "Signal favored / Talk route insurance."
      rewardId: "signal_core"
      log: "SALVAGE EVENT: CALLBOX SIGNAL NEST"
      moeLine: "非常電話がSignalを抱いてる。交渉するなら、これが効く。"
    underpass_service_locker:
      title: "Underpass Service Locker"
      pool: "salvage.stage_1"
      weight: 1
      tags: "ammo, se, service, one_pull"
      body: "A maintenance locker rattles with mixed munitions. The underpass is shifting, so only one drawer can be forced open."
      effects: "Ammo or S-E recovery favored."
      rewardId: "se_cell"
      log: "SALVAGE EVENT: UNDERPASS SERVICE LOCKER"
      moeLine: "整備ロッカー。弾かS-E、どっちを残したいかで選ぼう。"
