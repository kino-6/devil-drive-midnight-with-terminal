events:
  salvage:
    boss_ammo_case:
      title: "Boss Ammo Case"
      pool: "salvage.boss_prep"
      weight: 1
      tags: "boss, ammo, one_pull"
      body: "A sealed case carries heavy shells for the final contact. The toll signal is close enough that only one prep action is safe."
      effects: "Boss prep ammo favored / one safe extraction."
      rewardId: "ammo_kit"
      log: "BOSS PREP EVENT: AMMO CASE"
      moeLine: "主砲弾、深層前に足せる。"
    saint_plate_scrap:
      title: "Saint Plate Scrap"
      pool: "salvage.boss_prep"
      weight: 1
      tags: "boss, armor, one_pull"
      body: "A bent toll plate can reinforce the front frame. The plate daemon will notice after one weld."
      effects: "Boss prep armor favored / one weld cycle."
      rewardId: "armor_kit"
      log: "BOSS PREP EVENT: PLATE SCRAP"
      moeLine: "装甲に回せる板。料金所前なら助かる。"
    signal_relay_stub:
      title: "Signal Relay Stub"
      pool: "salvage.boss_prep"
      weight: 1
      tags: "boss, signal, analyze, one_pull"
      body: "A relay stub holds a cleaner read on the deep signal. Pulling it burns the remaining carrier."
      effects: "Boss prep signal favored / one carrier pull."
      rewardId: "signal_kit"
      log: "BOSS PREP EVENT: RELAY STUB"
      moeLine: "深層信号を少し読みやすくできる。"
    tollbooth_battery_rack:
      title: "Tollbooth Battery Rack"
      pool: "salvage.boss_prep"
      weight: 1
      tags: "boss, se, signal, one_pull"
      body: "A tollbooth battery rack still hums under the counter. Taking one cell wakes the gate sensors, but it can feed the last S-E shot."
      effects: "Boss prep S-E favored / sensor wake risk."
      rewardId: "se_kit"
      log: "BOSS PREP EVENT: BATTERY RACK"
      moeLine: "S-Eセル、一本だけ抜ける。関門に気づかれる前に。"
    lane_barrier_patch:
      title: "Lane Barrier Patch"
      pool: "salvage.boss_prep"
      weight: 1
      tags: "boss, armor, fuel, one_pull"
      body: "A flexible lane barrier can be cut into a crude front patch. It will not look pretty, but the next impact cares more than we do."
      effects: "Armor survival favored / final contact prep."
      rewardId: "armor_kit"
      log: "BOSS PREP EVENT: LANE BARRIER PATCH"
      moeLine: "見た目は悪いけど、装甲にはなる。Boss前なら十分。"
