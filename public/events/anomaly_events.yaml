events:
  anomaly:
    memory_trace:
      title: "Memory Trace"
      pool: "anomaly.stage_1"
      weight: 1
      tags: "story, analyze"
      body: "A weak trace resembles the previous driver logs."
      effects: "Analyze-oriented anomaly."
      log: "ANOMALY EVENT: MEMORY TRACE"
      moeLine: "前任者ログに似た波形。慎重に拾おう。"
    open_radio:
      title: "Open Radio"
      pool: "anomaly.stage_1"
      weight: 1
      tags: "talk, signal"
      body: "The radio carrier opens long enough for a first reply."
      effects: "Talk setup and rare route signal."
      routeChoice: "open_radio"
      log: "ANOMALY EVENT: AM 666.0 OPEN"
      moeLine: "AM帯が開いた。声を返せるかも。"
    archive_echo:
      title: "Archive Echo"
      pool: "anomaly.stage_1"
      weight: 1
      tags: "archive, demon, analyze"
      body: "The demon archive pings against an old profile signature."
      effects: "Demon archive hint."
      log: "ANOMALY EVENT: ARCHIVE ECHO"
      moeLine: "既知悪魔の反応に似てる。記録と照合できる。"
    soft_channel:
      title: "Soft Channel"
      pool: "anomaly.stage_1"
      weight: 1
      tags: "talk, low_risk"
      body: "A clean carrier forms a small, patient talk window."
      effects: "Talk boost hint."
      routeChoice: "open_radio"
      log: "ANOMALY EVENT: SOFT CHANNEL"
      moeLine: "声が荒れてない。話すなら今。"
    false_carrier:
      title: "False Carrier"
      pool: "anomaly.stage_1"
      weight: 1
      tags: "risk, signal"
      body: "The carrier doubles back through the windshield band."
      effects: "Signal risk anomaly."
      log: "ANOMALY EVENT: FALSE CARRIER"
      moeLine: "搬送波が二重に見える。踏み込みすぎないで。"
