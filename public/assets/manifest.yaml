# Asset manifest (YAML)
# Relative paths are resolved from /assets/
version: "starter-pack"

media:
  bgm: "bgm/night_loop_main.ogg"
  sfx:
    run_start: "sfx/run_start.wav"
    scan_ok: "sfx/scan_ok.wav"
    scan_fail: "sfx/scan_fail.wav"
    command: "sfx/command.wav"
    hit: "sfx/hit.wav"
    contract: "sfx/contract.wav"
    warning: "sfx/warning.wav"
    reward: "sfx/reward.wav"
    result: "sfx/result.wav"
    game_over: "sfx/game_over.wav"
    garage_enter: "sfx/garage_enter.wav"

images:
  logo: "ui/logo.png"
  player: "ui/player.png"
  moe: "ui/moe.png"
  enemies:
    whisper_broker: "enemies/whisper_broker.png"
    roadside_phone: "enemies/roadside_phone.png"
    pixie_shibuya_glow: "enemies/pixie_shibuya_glow.png"
    foxfire_navi: "enemies/foxfire_navi.png"
    no_face_taxi_passenger: "enemies/no_face_taxi_passenger.png"
    silent_shape: "enemies/silent_shape.png"
    abandoned_ai_navi: "enemies/abandoned_ai_navi.png"
    road_reaper: "enemies/road_reaper.png"
    toll_gate_saint: "enemies/toll_gate_saint.png"
  ui:
    windshield: "ui/windshield_bg.png"
    roadOverlay: "ui/road_overlay.png"

ui:
  shellClass: "theme-midnight"
  cssVars:
    bg: "#07090d"
    panel: "#101318"
    amber: "#d39a4a"
