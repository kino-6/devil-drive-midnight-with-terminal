# Asset manifest (YAML)
# Relative paths are resolved from /assets/
version: "starter-pack"

media:
  bgm: "bgm/night_loop_main.ogg"
  sfx:
    run_start: "sfx/run_start.wav"
    scan_ok: "sfx/scan_ok.wav"
    scan_fail: "sfx/scan_fail.wav"
    command: "sfx/command.wav"
    hit: "sfx/hit.wav"
    contract: "sfx/contract.wav"
    warning: "sfx/warning.wav"
    reward: "sfx/reward.wav"
    result: "sfx/result.wav"
    game_over: "sfx/game_over.wav"
    garage_enter: "sfx/garage_enter.wav"

images:
  moe: "images/moe/MOE_Default.png"
  enemies:
    pixie_shibuya_glow: "images/devil/Pixie.png"
    silent_shape: "images/devil/Silent_Shape.png"
    abandoned_ai_navi: "images/devil/Abandoned_AI_Navi.png"
    road_reaper: "images/devil/Closure_Ogre.png"
    toll_gate_saint: "images/devil/Toll_Gate_Saint.png"
  ui:
    windshield: "images/ui/nightloop.png"

ui:
  shellClass: "theme-midnight"
  cssVars:
    bg: "#07090d"
    panel: "#101318"
    amber: "#d39a4a"
